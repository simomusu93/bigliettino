<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#f4f4f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bigliettino">
<title>Bigliettino</title>
<style>
  :root { --bg: #f4f4f2; --ink: #222; --muted: #6b6b66; --line: #dcdcd6; --send: #1f6feb; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; min-height: 100vh; }
  h1 { margin: 4px 0 0; font-size: 20px; text-align: center; }
  .pad { position: relative; width: 100%; aspect-ratio: 1; background: #fffdf5; border-radius: 16px; border: 1px solid var(--line); box-shadow: 0 2px 10px rgba(0,0,0,.06); overflow: hidden; touch-action: none; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .hint[hidden] { display: none; }
  .hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #b9b9b2; pointer-events: none; font-size: 18px; }
  .colors { display: flex; justify-content: center; gap: 16px; }
  .color { width: 40px; height: 40px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 1px var(--line); padding: 0; cursor: pointer; }
  .color[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--ink); }
  .row { display: flex; gap: 12px; }
  button.act { flex: 1; border: 0; border-radius: 14px; padding: 15px 0; font: 600 17px/1 inherit; font-family: inherit; cursor: pointer; }
  .clear { background: #e6e6e1; color: var(--ink); }
  .send { background: var(--send); color: #fff; }
  button:disabled { opacity: .5; }
  .status { min-height: 1.4em; text-align: center; color: var(--muted); }
  .status.ok { color: #1e7a3c; } .status.err { color: #b3261e; }
  .broken { padding: 24px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Bigliettino per la TV</h1>
  <div class="pad" id="pad"><canvas id="canvas"></canvas><div class="hint" id="hint">Scrivi qui con il dito o il pennino</div></div>
  <div class="colors" id="colors">
    <button class="color" style="background:#1d3c78" data-color="#1d3c78" aria-label="Blu" aria-pressed="true"></button>
    <button class="color" style="background:#c0392b" data-color="#c0392b" aria-label="Rosso" aria-pressed="false"></button>
    <button class="color" style="background:#222222" data-color="#222222" aria-label="Nero" aria-pressed="false"></button>
    <button class="color" style="background:#2e8b57" data-color="#2e8b57" aria-label="Verde" aria-pressed="false"></button>
  </div>
  <div class="row"><button class="act clear" id="clear">Cancella</button><button class="act send" id="send">Invia</button></div>
  <p class="status" id="status" aria-live="polite"></p>
</main>
<script>
(() => {
  // The secret topic travels only in the link's #fragment, which browsers never send to the server.
  const topic = location.hash.slice(1);
  if (!/^[A-Za-z0-9]{20,}$/.test(topic)) {
    document.querySelector('main').innerHTML = '<p class="broken">Link incompleto: apri il link completo del bigliettino.</p>';
    return;
  }
  const GRID = 255, MAX_BYTES = 3900, PREFIX = 'B1:';
  const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');
  const hint = document.getElementById('hint'), status = document.getElementById('status');
  const sendBtn = document.getElementById('send');
  let strokes = [], current = null, color = '#1d3c78';

  function resize() {
    const r = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr);
    redraw();
  }
  function drawStroke(s) {
    const w = canvas.width;
    ctx.strokeStyle = s.color; ctx.lineWidth = w / 64; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(s.pts[0][0] * w, s.pts[0][1] * w);
    if (s.pts.length === 1) ctx.lineTo(s.pts[0][0] * w + 0.1, s.pts[0][1] * w);
    for (const p of s.pts.slice(1)) ctx.lineTo(p[0] * w, p[1] * w);
    ctx.stroke();
  }
  function redraw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    strokes.forEach(drawStroke);
    hint.hidden = strokes.length > 0;
  }
  function point(e) {
    const r = canvas.getBoundingClientRect();
    return [Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))];
  }
  canvas.addEventListener('pointerdown', e => {
    e.preventDefault(); canvas.setPointerCapture(e.pointerId);
    current = { color, pts: [point(e)] }; strokes.push(current);
    status.textContent = ''; status.className = 'status'; redraw();
  });
  canvas.addEventListener('pointermove', e => {
    if (!current) return;
    for (const ev of (e.getCoalescedEvents ? e.getCoalescedEvents() : [e])) current.pts.push(point(ev));
    redraw();
  });
  const end = () => { current = null; };
  canvas.addEventListener('pointerup', end); canvas.addEventListener('pointercancel', end);

  document.getElementById('colors').addEventListener('click', e => {
    const b = e.target.closest('.color'); if (!b) return;
    color = b.dataset.color;
    document.querySelectorAll('.color').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  });
  document.getElementById('clear').addEventListener('click', () => { strokes = []; status.textContent = ''; redraw(); });

  // Ramer-Douglas-Peucker on the 0-255 grid keeps the message under ntfy's 4 KB text limit.
  function simplify(pts, eps) {
    if (pts.length < 3) return pts;
    const [a, b] = [pts[0], pts[pts.length - 1]];
    let far = 0, idx = 0;
    for (let i = 1; i < pts.length - 1; i++) {
      const d = distToSegment(pts[i], a, b);
      if (d > far) { far = d; idx = i; }
    }
    if (far <= eps) return [a, b];
    return simplify(pts.slice(0, idx + 1), eps).slice(0, -1).concat(simplify(pts.slice(idx), eps));
  }
  function distToSegment(p, a, b) {
    const dx = b[0] - a[0], dy = b[1] - a[1], len = dx * dx + dy * dy;
    const t = len ? Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / len)) : 0;
    return Math.hypot(p[0] - a[0] - t * dx, p[1] - a[1] - t * dy);
  }
  function encode(eps) {
    const s = strokes.map(st => {
      const grid = st.pts.map(p => [Math.round(p[0] * GRID), Math.round(p[1] * GRID)]);
      return [st.color].concat(...simplify(grid, eps));
    });
    return PREFIX + JSON.stringify({ s });
  }

  sendBtn.addEventListener('click', async () => {
    if (!strokes.length) { status.textContent = 'Scrivi qualcosa prima di inviare.'; status.className = 'status err'; return; }
    let body = null;
    for (const eps of [0.6, 1, 1.5, 2.2, 3, 4]) {
      const text = encode(eps);
      if (new Blob([text]).size <= MAX_BYTES) { body = text; break; }
    }
    if (!body) { status.textContent = 'Il bigliettino è troppo lungo: scrivi qualcosa di più breve.'; status.className = 'status err'; return; }
    sendBtn.disabled = true; status.textContent = 'Invio…'; status.className = 'status';
    try {
      const res = await fetch('https://ntfy.sh/' + topic, { method: 'POST', body });
      if (!res.ok) throw new Error(res.status);
      const now = new Date();
      status.textContent = 'Inviato alle ' + now.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' }) + ' ✓ Comparirà sulla TV entro mezzo minuto.';
      status.className = 'status ok';
    } catch (err) {
      status.textContent = 'Non inviato: controlla la connessione e riprova.'; status.className = 'status err';
    } finally { sendBtn.disabled = false; }
  });

  window.addEventListener('resize', resize);
  resize();
})();
</script>
</body>
</html>
